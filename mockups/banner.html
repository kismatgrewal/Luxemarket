<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:440px;overflow:hidden;font-family:Inter,sans-serif;background:#0B0B0C;color:#FAF8F4;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(120% 140% at 82% 20%, rgba(184,148,95,.22), transparent 55%),radial-gradient(90% 120% at 0% 100%, rgba(15,107,79,.16), transparent 50%)}
.wrap{position:relative;display:grid;grid-template-columns:1.15fr 1fr;height:100%;align-items:center;padding:0 62px;gap:30px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:#D9C4A1;margin-bottom:20px}
.brand{font-family:Fraunces,serif;font-size:66px;font-weight:600;letter-spacing:-.02em;line-height:1}
.brand span{color:#B8945F}
.tag{font-family:Fraunces,serif;font-size:23px;color:rgba(250,248,244,.9);margin:20px 0 24px;font-weight:400;line-height:1.3;max-width:440px}
.pills{display:flex;flex-wrap:wrap;gap:9px;max-width:470px}
.pill{font-size:12.5px;font-weight:500;color:rgba(250,248,244,.82);border:1px solid rgba(250,248,244,.16);border-radius:999px;padding:7px 14px;background:rgba(250,248,244,.04)}
.collage{position:relative;height:440px}
.ph{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.7);border:1px solid rgba(250,248,244,.1)}
.ph img{width:100%;height:100%;object-fit:cover}
.p1{width:220px;height:280px;right:250px;top:80px;transform:rotate(-5deg)}
.p2{width:210px;height:260px;right:44px;top:56px;transform:rotate(5deg);z-index:2}
.p3{width:180px;height:180px;right:150px;top:270px;transform:rotate(-2deg);z-index:3}
.chip{position:absolute;right:210px;top:44px;z-index:5;background:rgba(250,248,244,.96);color:#0B0B0C;border-radius:12px;padding:9px 13px;font-size:11px;display:flex;gap:9px;align-items:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
.chip img{width:30px;height:30px;border-radius:7px;object-fit:cover}
</style></head><body>
<div class="bg"></div>
<div class="wrap">
  <div>
    <div class="eyebrow">Multi-vendor marketplace</div>
    <div class="brand">Luxe<span>Market</span></div>
    <div class="tag">A curated marketplace for premium goods — storefront, vendor dashboards & an admin console.</div>
    <div class="pills"><span class="pill">Next.js 14</span><span class="pill">TypeScript</span><span class="pill">Prisma · PostgreSQL</span><span class="pill">Stripe Connect</span><span class="pill">OpenAI</span><span class="pill">n8n</span><span class="pill">Docker</span></div>
  </div>
  <div class="collage">
    <div class="ph p1"><img src="../public/products/cassis-top-handle-bag.jpg"></div>
    <div class="ph p2"><img src="../public/products/meridian-chronograph.jpg"></div>
    <div class="ph p3"><img src="../public/products/rivage-sunglasses.jpg"></div>
    <div class="chip"><img src="../public/products/solstice-diamond-ring.jpg"><div><div style="font-weight:700">438 vendors</div><div style="color:#6B6B70">12,400 products</div></div></div>
  </div>
</div>
</body></html>

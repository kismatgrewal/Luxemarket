<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif;background:#0B0B0C;color:#FAF8F4;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bg{position:absolute;inset:0;background:radial-gradient(100% 100% at 50% -10%, rgba(184,148,95,.24), transparent 55%)}
.eyebrow{position:relative;font-size:14px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#D9C4A1;margin-bottom:26px}
.brand{position:relative;font-family:Fraunces,serif;font-size:104px;font-weight:600;letter-spacing:-.02em;line-height:1}
.brand span{color:#B8945F}
.tag{position:relative;font-family:Fraunces,serif;font-size:28px;color:rgba(250,248,244,.86);margin-top:24px;font-weight:400}
.row{position:relative;display:flex;gap:16px;margin-top:52px}
.row .t{width:104px;height:104px;border-radius:16px;overflow:hidden;border:1px solid rgba(250,248,244,.12);box-shadow:0 20px 40px -18px rgba(0,0,0,.7)}
.row .t img{width:100%;height:100%;object-fit:cover}
.pills{position:relative;display:flex;gap:10px;margin-top:44px;font-size:14px;color:rgba(250,248,244,.7)}
.pills span{border:1px solid rgba(250,248,244,.16);border-radius:999px;padding:8px 16px}
</style></head><body>
<div class="bg"></div>
<div class="eyebrow">Multi-vendor marketplace</div>
<div class="brand">Luxe<span>Market</span></div>
<div class="tag">Exceptional things, from makers worth knowing.</div>
<div class="row">
  <div class="t"><img src="../public/products/meridian-chronograph.jpg"></div>
  <div class="t"><img src="../public/products/cassis-top-handle-bag.jpg"></div>
  <div class="t"><img src="../public/products/solstice-diamond-ring.jpg"></div>
  <div class="t"><img src="../public/products/rivage-sunglasses.jpg"></div>
  <div class="t"><img src="../public/products/aria-headphones.jpg"></div>
</div>
<div class="pills"><span>Next.js · TypeScript · Prisma</span><span>Stripe · OpenAI · n8n</span></div>
</body></html>

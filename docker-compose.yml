# LuxeMarket — local stack: PostgreSQL, the app, and n8n for automations.
#
#   docker compose up -d db n8n     # dependencies only; run `pnpm dev` on host
#   docker compose up --build       # full stack (db + app + n8n)
#   docker compose down -v          # stop and wipe the database volume

name: luxemarket

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: luxe
      POSTGRES_PASSWORD: luxe
      POSTGRES_DB: luxemarket
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxe -d luxemarket"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Uses the compose network hostname `db` rather than localhost.
      DATABASE_URL: "postgresql://luxe:luxe@db:5432/luxemarket?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-dev-insecure-secret-change-me}"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_NAME: "LuxeMarket"
      # Optional integrations — supply via your shell or an .env file.
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_CONNECT_CLIENT_ID: "${STRIPE_CONNECT_CLIENT_ID:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      N8N_WEBHOOK_URL: "${N8N_WEBHOOK_URL:-http://n8n:5678/webhook}"
      N8N_WEBHOOK_SECRET: "${N8N_WEBHOOK_SECRET:-dev-n8n-secret}"
    ports:
      - "3000:3000"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: "localhost"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "http://localhost:5678/"
      GENERIC_TIMEZONE: "UTC"
      # Basic auth for the local editor UI.
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD:-admin}"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  db_data:
  n8n_data:
